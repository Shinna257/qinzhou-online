<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>秦州市综合协调委员会历史档案查询系统</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f5f5f5;
    font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;
}

/* =========================
   正常政府档案页面
========================= */

#normalPage{
    width:100%;
    height:100%;
    background:#f5f5f5;
    color:#333;
    transition:opacity 1s;
}

.top{
    height:36px;
    background:#f7f7f7;
    border-bottom:1px solid #ddd;
    color:#666;
    font-size:13px;
}

.top-inner{
    width:1200px;
    margin:auto;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header{
    height:105px;
    background:white;
    border-bottom:1px solid #ddd;
}

.header-inner{
    width:1200px;
    margin:auto;
    height:100%;
    display:flex;
    align-items:center;
}

.logo{
    width:55px;
    height:55px;
    border:3px solid #b40000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b40000;
    font-family:"SimSun",serif;
    font-size:27px;
    margin-right:15px;
}

.title{
    color:#a90000;
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.nav{
    height:48px;
    background:#a90000;
}

.nav-inner{
    width:1200px;
    margin:auto;
    height:100%;
    display:flex;
}

.nav-item{
    width:150px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:15px;
    border-right:1px solid rgba(255,255,255,.12);
}

.content{
    width:1200px;
    margin:30px auto;
    background:white;
    min-height:550px;
    border:1px solid #ddd;
}

.content-header{
    height:70px;
    border-bottom:1px solid #ddd;
    padding:20px 25px;
}

.content-header h1{
    font-size:22px;
    color:#333;
}

.archive{
    padding:35px;
}

.archive-title{
    font-size:18px;
    color:#a90000;
    margin-bottom:20px;
}

.line{
    height:1px;
    background:#ddd;
    margin:20px 0;
}

.status{
    color:#666;
    font-size:14px;
    line-height:2;
}

#systemMessage{
    margin-top:30px;
    padding:20px;
    background:#f7f7f7;
    border:1px solid #ddd;
    font-family:"Courier New",monospace;
    font-size:13px;
    color:#555;
}

#errorLayer{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:0;
    z-index:50;
}

/* =========================
   故障效果
========================= */

.glitch-line{
    position:absolute;
    left:0;
    width:100%;
    height:1px;
    background:#a90000;
    opacity:.65;
}

#redWarning{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-family:"Courier New",monospace;
    color:#b00000;
    font-size:17px;
    letter-spacing:1px;
    text-align:center;
    opacity:0;
    z-index:100;
    white-space:nowrap;
}

/* 屏幕轻微抖动 */

.shake{
    animation:shake .08s infinite;
}

@keyframes shake{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(2px,-1px);}
    75%{transform:translate(-1px,-2px);}
    100%{transform:translate(1px,2px);}
}

/* 闪烁 */

.flash{
    animation:flash .12s infinite;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:.25;}
    100%{opacity:1;}
}

/* 黑色覆盖 */

#blackout{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    z-index:90;
    pointer-events:none;
}

/* 红色故障文字 */

.corrupt{
    position:absolute;
    font-family:"Courier New",monospace;
    color:#a00000;
    font-size:12px;
    opacity:.75;
}

</style>
</head>

<body>

<div id="normalPage">

    <div class="top">
        <div class="top-inner">
            <span>秦州市人民政府</span>
            <span>政务公开　网站地图　联系我们</span>
        </div>
    </div>

    <div class="header">
        <div class="header-inner">

            <div class="logo">秦</div>

            <div>
                <div class="title">
                    秦州在线
                </div>

                <div class="subtitle">
                    秦州市综合协调委员会历史档案查询系统
                </div>
            </div>

        </div>
    </div>

    <div class="nav">
        <div class="nav-inner">
            <div class="nav-item">首页</div>
            <div class="nav-item">机构概况</div>
            <div class="nav-item">主要职责</div>
            <div class="nav-item">机构设置</div>
            <div class="nav-item">工作机制</div>
            <div class="nav-item">档案管理</div>
            <div class="nav-item">联系我们</div>
        </div>
    </div>

    <div class="content">

        <div class="content-header">
            <h1>历史专项档案查询</h1>
        </div>

        <div class="archive">

            <div class="archive-title">
                档案检索结果
            </div>

            <div class="status">
                正在读取档案信息……
            </div>

            <div class="line"></div>

            <div class="status" id="statusText">
                正在连接秦州市综合协调委员会历史档案数据库……
            </div>

            <div id="systemMessage">
                SYSTEM STATUS : CONNECTING<br>
                ARCHIVE SERVER : QZ-ARCHIVE<br>
                REQUEST ID : QZ-ARCH-07
            </div>

        </div>

    </div>

</div>


<!-- 故障层 -->

<div id="errorLayer"></div>

<div id="redWarning"></div>

<div id="blackout"></div>


<script>

const normalPage = document.getElementById("normalPage");
const errorLayer = document.getElementById("errorLayer");
const warning = document.getElementById("redWarning");
const blackout = document.getElementById("blackout");
const statusText = document.getElementById("statusText");
const systemMessage = document.getElementById("systemMessage");


/* =========================================
   第一阶段：正常读取
========================================= */

setTimeout(() => {

    statusText.innerHTML =
        "正在读取档案目录，请稍候……";

    systemMessage.innerHTML =
        "SYSTEM STATUS : CONNECTED<br>" +
        "ARCHIVE SERVER : QZ-ARCHIVE<br>" +
        "REQUEST ID : QZ-ARCH-07<br>" +
        "ARCHIVE INDEX : FOUND";

}, 900);


/* =========================================
   第二阶段：出现异常
========================================= */

setTimeout(() => {

    statusText.innerHTML =
        "档案索引读取异常。正在重新建立连接……";

    systemMessage.innerHTML =
        "SYSTEM STATUS : WARNING<br>" +
        "ARCHIVE SERVER : QZ-ARCHIVE<br>" +
        "REQUEST ID : QZ-ARCH-07<br>" +
        "INDEX RESPONSE : UNSTABLE";

}, 1800);


/* =========================================
   第三阶段：第一次闪烁
========================================= */

setTimeout(() => {

    document.body.classList.add("flash");

    statusText.innerHTML =
        "警告：检测到未登记档案节点。";

}, 2700);


/* =========================================
   第四阶段：停止闪烁，开始故障
========================================= */

setTimeout(() => {

    document.body.classList.remove("flash");

    errorLayer.style.opacity = "1";

    normalPage.classList.add("shake");

    statusText.innerHTML =
        "错误：无法读取档案内容。";

    systemMessage.innerHTML =
        "SYSTEM STATUS : ERROR<br>" +
        "ARCHIVE SERVER : QZ-ARCHIVE<br>" +
        "REQUEST ID : QZ-ARCH-07<br>" +
        "ERROR CODE : AR-17<br>" +
        "DATABASE RESPONSE : NULL";

}, 3400);


/* =========================================
   添加故障横线
========================================= */

function addGlitchLine(){

    const line = document.createElement("div");

    line.className = "glitch-line";

    line.style.top =
        Math.random() * 100 + "%";

    line.style.opacity =
        Math.random() * .8 + .2;

    line.style.height =
        (Math.random() * 3 + 1) + "px";

    errorLayer.appendChild(line);

    setTimeout(() => {
        line.remove();
    }, 150);

}


/* =========================================
   添加乱码 / 系统信息
========================================= */

function addCorruptText(){

    const text = document.createElement("div");

    text.className = "corrupt";

    const messages = [

        "ARCHIVE NODE ERROR",
        "QZ-ARCHIVE",
        "READ FAILURE",
        "ACCESS VIOLATION",
        "INDEX NOT FOUND",
        "DATA INTEGRITY ERROR",
        "RETRY...",
        "NULL",
        "SYSTEM ERROR",
        "ARCHIVE CONNECTION LOST"

    ];

    text.innerText =
        messages[Math.floor(Math.random()*messages.length)];

    text.style.left =
        Math.random()*90 + "%";

    text.style.top =
        Math.random()*90 + "%";

    errorLayer.appendChild(text);

    setTimeout(() => {
        text.remove();
    }, 500);

}


/* =========================================
   第五阶段：故障越来越严重
========================================= */

let glitchTimer = setInterval(() => {

    addGlitchLine();
    addGlitchLine();

    if(Math.random() > .45){
        addCorruptText();
    }

}, 120);


/* =========================================
   第六阶段：出现真正异常信息
========================================= */

setTimeout(() => {

    warning.innerHTML =
        "ARCHIVE DATABASE CONNECTION LOST";

    warning.style.opacity = "1";

}, 4300);


setTimeout(() => {

    warning.innerHTML =
        "正在恢复档案连接……";

}, 5000);


setTimeout(() => {

    warning.innerHTML =
        "WARNING : 该档案不属于公开查询范围";

}, 5600);


/* =========================================
   第七阶段：政府页面彻底失效
========================================= */

setTimeout(() => {

    warning.innerHTML =
        "ARCHIVE ACCESS : DENIED";

    normalPage.style.opacity = ".25";

}, 6200);


/* =========================================
   第八阶段：黑屏
========================================= */

setTimeout(() => {

    clearInterval(glitchTimer);

    normalPage.classList.remove("shake");

    blackout.style.transition =
        "opacity 1.2s ease";

    blackout.style.opacity = "1";

}, 7000);


/* =========================================
   第九阶段：进入隐藏档案
========================================= */

setTimeout(() => {

    window.location.href = "sishuhui.html";

}, 8500);

</script>

</body>
</html>
